[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-features"
version = "0.1.0"
description = "File-in file-out GIS enrichment for hedgerow segments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Codex" }
]
dependencies = [
  "astral>=3.2",
  "click>=8.1",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gis = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyogrio>=0.7",
  "fiona>=1.9",
  "rasterio>=1.3",
  "networkx>=3.0",
]
ui = [
  "streamlit>=1.35",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
hedge-features = "hedge_features.cli:main"

[tool.setuptools]
packages = [
  "hedge_features",
  "hedge_features.acoustics",
  "hedge_features.datasets",
  "hedge_features.features",
  "hedge_features.profiles",
  "hedge_features.planning",
  "hedge_features.species",
  "hedge_features.screening",
  "hedge_features.v2",
  "hedge_features.frameworks",
  "hedge_features.frameworks.bats_screening_v1",
]
include-package-data = true

[tool.setuptools.package-data]
hedge_features = ["profiles/*.yaml", "frameworks/*/*.json", "frameworks/*/*.md", "frameworks/*/*/*.json", "frameworks/*/*/*.md"]
