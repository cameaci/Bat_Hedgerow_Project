[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bat-hedgerow-hsi"
version = "1.0.0"
description = "England bat hedgerow suitability index (HSI) decision-support tool for prioritising static bat surveys"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "rasterio>=1.3",
  "networkx>=3.0",
  "scipy>=1.11",
  "streamlit>=1.35",
  "folium>=0.16",
  "streamlit-folium>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = [
  "hsi",
  "hedge_features",
  "hedge_features.datasets",
  "hedge_features.features",
]
include-package-data = false
