name: bats_bankable_england_v2
description: England-first bankable bat survey planning profile with strict data semantics and species-aware planning support.
working_crs: EPSG:27700
buffers_m: [25, 50, 100, 250, 500, 1000]
semantic_mode: bankable
guidance_regime_version: bct4_ne2025_england_v1
output:
  id_column: hf_uid
datasets:
  os_open_roads:
    license: "Open Government Licence v3.0 (or OSM ODbL fallback in auto mode)"
    attribution: "Contains OS data © Crown copyright and database right (Open Government Licence), or OpenStreetMap contributors (ODbL) when auto-fetched fallback is used."
    optional: true
    dataset_class: anonymous_open
    source_type: vector_lines
    source_resolution: open-road-centerlines
    coverage_scope: england_or_better
    auto_provider:
      type: osm_overpass_lines
      query_kind: roads
      aoi_buffer_m: 5000
  os_open_rivers:
    license: "Open Government Licence v3.0 (or OSM ODbL fallback in auto mode)"
    attribution: "Contains OS data © Crown copyright and database right (Open Government Licence), or OpenStreetMap contributors (ODbL) when auto-fetched fallback is used."
    optional: true
    dataset_class: anonymous_open
    source_type: vector_lines
    source_resolution: open-hydro-lines
    coverage_scope: england_or_better
    auto_provider:
      type: osm_overpass_lines
      query_kind: waterways
      aoi_buffer_m: 5000
  worldcover:
    license: "CC BY 4.0"
    attribution: "ESA WorldCover © ESA and partners (CC BY 4.0)."
    optional: true
    dataset_class: anonymous_open
    source_type: raster_categorical
    source_resolution: 10m
    coverage_scope: global
    auto_provider:
      type: pc_stac_raster
      collection: esa-worldcover
      asset: map
      aoi_buffer_m: 1500
  viirs_nightlights:
    license: "NASA open data terms"
    attribution: "NASA/NOAA VIIRS nighttime lights (e.g. Black Marble VNP46A2)."
    optional: true
    dataset_class: authenticated_free
    source_type: raster_time_series
    source_resolution: 500m-class
    coverage_scope: global
    authenticated: true
    auto_provider:
      type: unsupported
      reason: "Authenticated Earthdata/EOG access is required for production night-light rasters."
  copdem:
    license: "Copernicus terms"
    attribution: "Copernicus DEM GLO-30."
    optional: true
    dataset_class: anonymous_open
    source_type: raster_dem
    source_resolution: 30m
    coverage_scope: global
    auto_provider:
      type: pc_stac_raster
      collection: cop-dem-glo-30
      asset: data
      aoi_buffer_m: 1500
  ne_phi:
    license: "Open Government Licence / DEFRA terms"
    attribution: "Natural England Priority Habitats Inventory."
    optional: true
    dataset_class: anonymous_open
    source_type: vector_polygons
    source_resolution: inventory
    coverage_scope: england
    auto_provider:
      type: arcgis_feature_layer
      service_url: "https://services.arcgis.com/JJzESW51TqeY9uat/arcgis/rest/services/Priority_Habitats_Inventory_England/FeatureServer/0"
      aoi_buffer_m: 2000
  ne_awi:
    license: "Open Government Licence / DEFRA terms"
    attribution: "Natural England Ancient Woodland Inventory."
    optional: true
    dataset_class: anonymous_open
    source_type: vector_polygons
    source_resolution: inventory
    coverage_scope: england
    auto_provider:
      type: arcgis_feature_layer
      service_url: "https://services.arcgis.com/JJzESW51TqeY9uat/arcgis/rest/services/Ancient_Woodland_England/FeatureServer/0"
      aoi_buffer_m: 50000
  osm_buildings:
    license: "ODbL 1.0"
    attribution: "Contains OpenStreetMap data © OpenStreetMap contributors (ODbL)."
    optional: true
    dataset_class: anonymous_open
    source_type: vector_features
    source_resolution: volunteered-geodata
    coverage_scope: england_or_better
    auto_provider:
      type: osm_overpass_features
      query_kind: buildings
      aoi_buffer_m: 5000
  osm_structures_roost:
    license: "ODbL 1.0"
    attribution: "Contains OpenStreetMap data © OpenStreetMap contributors (ODbL)."
    optional: true
    dataset_class: anonymous_open
    source_type: vector_features
    source_resolution: volunteered-geodata
    coverage_scope: england_or_better
    auto_provider:
      type: osm_overpass_features
      query_kind: structures_roost
      aoi_buffer_m: 5000
  ea_lidar_dtm:
    license: "Open Government Licence v3.0"
    attribution: "Environment Agency National LiDAR Programme DTM."
    optional: true
    dataset_class: anonymous_open
    source_type: raster_dtm
    source_resolution: 1m_or_2m
    coverage_scope: england
    auto_provider:
      type: unsupported
      reason: "Manual dataset path required in v1 bankable build."
  ea_lidar_dsm:
    license: "Open Government Licence v3.0"
    attribution: "Environment Agency National LiDAR Programme DSM."
    optional: true
    dataset_class: anonymous_open
    source_type: raster_dsm
    source_resolution: 1m_or_2m
    coverage_scope: england
    auto_provider:
      type: unsupported
      reason: "Manual dataset path required in v1 bankable build."
  living_england_habitat:
    license: "Open Government Licence v3.0 / Natural England terms"
    attribution: "Living England Habitat Map."
    optional: true
    dataset_class: anonymous_open
    source_type: vector_or_raster_habitat
    source_resolution: habitat_mapping
    coverage_scope: england
    auto_provider:
      type: unsupported
      reason: "Manual dataset path required in v1 bankable build."
  project_lighting_assets:
    license: "Project supplied"
    attribution: "Project lighting assets or assumed lighting layer."
    optional: true
    dataset_class: client_project
    source_type: vector_features
    source_resolution: project_design
    coverage_scope: project_only
    auto_provider:
      type: unsupported
      reason: "Project-supplied lighting layer."
feature_modules:
  - type: geometry_metrics
    enabled: true
  - type: network_metrics
    enabled: true
    tolerance_m: 1.0
    optional_dependency: networkx
  - type: vector_distance
    enabled: true
    dataset: os_open_roads
    geometry_kinds: [LineString, MultiLineString]
    column_prefix: dist_os_road
    distance_column: dist_os_road_m
  - type: vector_distance
    enabled: true
    dataset: os_open_rivers
    geometry_kinds: [LineString, MultiLineString]
    column_prefix: dist_os_river
    distance_column: dist_os_river_m
  - type: vector_line_density
    enabled: true
    dataset: os_open_roads
    buffers_m: [100, 250, 500]
    prefix: buf
    output_metric: m_per_ha
    density_column_template: "buf{radius}_os_road_density_m_per_ha"
  - type: vector_line_density
    enabled: true
    dataset: os_open_rivers
    buffers_m: [100, 250, 500]
    prefix: buf
    output_metric: m_per_ha
    density_column_template: "buf{radius}_os_river_density_m_per_ha"
  - type: vector_distance
    enabled: true
    dataset: project_lighting_assets
    geometry_kinds: [LineString, MultiLineString, Point, Polygon, MultiPolygon]
    column_prefix: dist_project_lighting
    distance_column: dist_project_lighting_m
  - type: raster_categorical_proportions
    enabled: true
    dataset: worldcover
    buffers_m: [100, 250, 500]
    class_map:
      tree: [10]
      shrubland: [20]
      grassland: [30]
      cropland: [40]
      built: [50]
      bare_sparse: [60]
      snow_ice: [70]
      water: [80]
      wetland: [90]
      mangroves: [95]
      moss_lichen: [100]
    column_template: "buf{radius}_worldcover_{class_name}_pct"
    patch_richness_column_template: "buf{radius}_worldcover_patch_richness"
    landscape_class_names: [tree, water, wetland]
    landscape_metrics: [edge_density_m_per_ha, largest_patch_index, core_area_pct]
    landscape_column_templates:
      edge_density_m_per_ha: "buf{radius}_worldcover_{class_name}_edge_density_m_per_ha"
      largest_patch_index: "buf{radius}_worldcover_{class_name}_largest_patch_index"
      core_area_pct: "buf{radius}_worldcover_{class_name}_core_area_pct"
  - type: raster_zonal_stats
    enabled: true
    dataset: viirs_nightlights
    buffers_m: [100, 250, 500]
    stats: [mean, median, p90]
    column_template: "buf{radius}_nightlight_{stat}"
  - type: raster_zonal_stats
    enabled: true
    dataset: copdem
    buffers_m: [100, 250, 500]
    stats: [mean, min, max]
    column_template: "buf{radius}_copdem_elev_{stat}"
    centroid_sample_column: "pt_copdem_elev"
  - type: vector_polygon_composition
    enabled: true
    dataset: ne_phi
    buffers_m: [100, 500]
    class_field: MainHabs
    selected_classes:
      broadleaved_woodland:
        contains_any: ["Woodland", "Broadleaved"]
      wetland:
        contains_any: ["Wetland", "Fen", "Reedbed"]
    column_template: "buf{radius}_phi_{class_name}_pct"
    coverage_flag_column: phi_coverage_flag
  - type: vector_distance
    enabled: true
    dataset: ne_awi
    geometry_kinds: [Polygon, MultiPolygon]
    column_prefix: dist_awi_ancwood
    distance_column: dist_awi_ancwood_m
    coverage_flag_column: awi_coverage_flag
  - type: osm_roost_proxies
    enabled: true
    buildings_dataset: osm_buildings
    structures_dataset: osm_structures_roost
  - type: microhabitat_proxies
    enabled: true
    worldcover_dataset: worldcover
    copdem_dataset: copdem
    include_roost_proxy_alias: false
  - type: lidar_hedgerow_structure
    enabled: true
    dtm_dataset: ea_lidar_dtm
    dsm_dataset: ea_lidar_dsm
    height_buffer_m: 5
    continuity_buffer_m: 10
